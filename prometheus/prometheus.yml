global:
  scrape_interval: 15s
  evaluation_interval: 15s


scrape_configs:
  - job_name: 'flight-booking-app'
    metrics_path: '/actuator/prometheus'
    scheme: https
    static_configs:
      - targets: ['antivirus-app:8443']
    scrape_interval: 10s
    scrape_timeout: 5s
    tls_config:
      insecure_skip_verify: true